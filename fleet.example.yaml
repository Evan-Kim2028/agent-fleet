# Global agent fleet config
# Preferred location: ~/.agent-fleet/fleet.yaml
# Copy to ~/.agent-fleet/fleet.yaml (see docs/FLEET-CONFIG.md)
# See docs/FLEET-CONFIG.md for paths, personas_dir rules, and import-shadow checks.

# Default backend: cursor (Cursor SDK), kimi (Kimi Code CLI), openrouter (OpenRouter HTTP),
# grok (Grok Build CLI), qwen (Alibaba Bailian), or agnes (Agnes AI; both reuse OpenRouter HTTP client)
default_backend: cursor
# composer-2.5 maps to the slow (non-fast) Cursor tier — agent-fleet
# explicitly sends {fast=false} so you don't get silently routed to the
# cheaper-quality fast variant. Use `composer-2.5-fast` to opt in.
default_model: composer-2.5
default_mode: agent
default_persona: coder
max_parallel: 3
timeout_seconds: 900
default_pipeline: simple

# --- Hard-failure redispatch (v0.5.0) ---
# Number of automatic retries when a task ends in a hard failure (error/expired/timeout/
# scope_violation). 1 = one retry, two total attempts. 0 disables.
# Override per-run with: fleet run ... --max-redispatches N
# Recommended: 0 in CI (fail fast), 1-2 in interactive use.
max_redispatches: 1

# --- Optional: fleet-wide default loadout size ---
# One of: minimal | standard | full. Used by derive_runtime when a
# complexity_tiers entry does not explicitly set loadout_size for that tier.
# A per-tier complexity_tiers override or the CLI `--loadout` flag win over this.
# default_loadout_size: standard

# --- Optional: Kimi Code CLI execution backend ---
# Requires: pip install not needed; install kimi-cli from Kimi Code
# export KIMI_API_KEY=sk-kimi-...   # https://platform.kimi.ai
# default_backend: kimi
# default_model: kimi-for-coding
# kimi_bin: ~/.local/bin/kimi-cli

# --- Optional: OpenRouter HTTP execution backend ---
# Requires: no binary to install — uses stdlib urllib.request
# export OPENROUTER_API_KEY=sk-or-...   # https://openrouter.ai/keys
# default_backend: openrouter
# default_model: null  # inherits tencent/hy3:free (the backend default)
# default_model: anthropic/claude-3.5-sonnet  # to pin a different model

# --- Optional: Grok Build CLI execution backend ---
# Requires: grok binary (https://x.ai/cli); run `grok login` (SuperGrok / X Premium+)
# No XAI_API_KEY required — uses ~/.grok/auth.json
# default_backend: grok
# default_model: grok-4.6
# grok_bin: ~/.grok/bin/grok

# --- Optional: Qwen execution backend (Alibaba Bailian, Token Plan Team Edition) ---
# Requires: no binary to install — reuses the OpenRouter OpenAI-compatible HTTP client
# export QWEN_API_KEY=sk-...   # store in .env
# default_backend: qwen
# default_model: qwen3.8-max-preview
# qwen_base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1

# --- Optional: Agnes execution backend (Agnes AI OpenAI-compatible API) ---
# Requires: no binary to install — reuses the OpenRouter OpenAI-compatible HTTP client
# export AGNES_API_KEY=sk-...   # store in .env
# Free tier ~20 RPM — prefer max_parallel: 1
# default_backend: agnes
# default_model: agnes-2.5-flash
# max_parallel: 1
# agnes_base_url: https://apihub.agnes-ai.com/v1

# personas_dir — bundled personas ship in the installed package (agent_fleet/personas/).
# Leave UNSET in this global file so fleet uses the package defaults.
# Relative paths here resolve against this config directory (~/.agent-fleet/) — usually wrong.
# For repo-local personas, set personas_dir in .agent-fleet.yaml (relative to repo root).
# Global override only with an absolute path to a custom persona tree:
# personas_dir: /absolute/path/to/my/personas

# --- MCP server catalog (v0.5.0) ---
# Named MCP servers that personas can opt into via mcp_servers: [name, ...].
# ${VAR} syntax is expanded from the environment at config-load time.
# Missing env vars cause a startup error with the variable name in the message.
#
# Uncomment the servers you want to use and set the required env vars:
#   export CONTEXT7_KEY=your_context7_api_key
#
# mcp_servers:
#   playwright:
#     type: stdio
#     command: npx
#     args: ["-y", "@playwright/mcp@latest"]
#
#   chrome_devtools:
#     type: stdio
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-chrome-devtools@latest"]
#     # TODO: confirm exact npm package name for Chrome DevTools MCP
#
#   context7:
#     type: http
#     url: https://mcp.context7.com/mcp
#     headers:
#       Authorization: "Bearer ${CONTEXT7_KEY}"
#
#   serena:
#     type: stdio
#     command: uvx
#     args: ["--from", "git+https://github.com/oraios/serena", "serena-mcp-server"]

personas:
  coder:
    prompt: coder.md
    # mcp_servers: [playwright, context7]   # uncomment after enabling mcp_servers above
  reviewer:
    prompt: reviewer.md
    # mcp_servers: [context7]               # uncomment after enabling mcp_servers above
  pr-analyzer:
    prompt: pr-analyzer.md
    model: composer-2.5
    mode: plan
  product-scout:
    prompt: product-scout.md
    mode: plan
  tech-scout:
    prompt: tech-scout.md
    mode: plan

# code_review auto_fix is repo-level (.agent-fleet.yaml), not global fleet.yaml.
# Default: auto_fix=false. When pr_loop.enabled with no code_review section, inherits
# auto_fix=true, auto_push=true, auto_pr_loop=true. See examples/repo-full.agent-fleet.yaml.

pipelines:
  simple:
    - execute
  code_review:
    - execute
    - review
  pr_review:
    - analyze
  scout:
    - product_scout
    - tech_scout
    - synthesize_scout
  full:
    - plan
    - research
    - synthesize
    - implement
    - verify
    - review

# `fleet serve` — one supervisor for the whole pipeline. Machine-level, so it
# lives in the GLOBAL fleet.yaml under a top-level `serve:` key; a repo may also
# carry `fleet_ops.serve` in its .agent-fleet.yaml. Every threshold has a safe
# default, so a repo with no serve section is unaffected. See docs/FLEET-SERVE.md.
serve:
  tick_seconds: 15
  shutdown_grace_s: 10
  # A bare slice NAME is resolved under systemd's nesting prefixes
  # (user.slice/user-N.slice/user@N.service/agents.slice), because
  # /sys/fs/cgroup/agents.slice does not exist on a systemd user session.
  cgroup: agents.slice
  throughput_window_hours: 1

  capacity:
    # AIMD watermarks. Below psi_low -> add; above psi_high -> drop; between
    # -> hold (that band is the hysteresis).
    psi_low: 10
    psi_high: 25
    memory_low_ratio: 0.70
    memory_high_ratio: 0.85
    # Hard limits, applied after every adjustment.
    floors:
      lanes: 1
      gates: 1
      tests: 1
      typecheck: 1
    ceilings:
      lanes: 20
      gates: 12
      tests: 6
      typecheck: 6
    step: 1
    decrease: 0.5
    # Saturated with nothing completing for this many ticks -> hold lanes at
    # the floor and prioritise finishing gates.
    starvation_ticks: 6

  # Command templates. Placeholders: {operator} {serve_dir} {capacity_file}
  # {max_lanes} {max_gates} {test_pool} {typecheck_pool} {gates_priority}.
  # Commands are exec'd WITHOUT a shell, so no $VAR expansion and no globs.
  components:
    dispatcher:
      command: "fleet dispatch --operator {operator} --max {max_lanes} --gates {max_gates}"
      backoff_initial_s: 5
      backoff_max_s: 300
      timeouts:
        crash:
          threshold: 5
          window_minutes: 15
        no_progress:
          restarts: 2
          window_minutes: 30
    merger:
      command: "fleet merge run --operator {operator} --capacity {capacity_file}"
    janitor:
      command: "true"

  watchdog:
    orphan_minutes: 60
    stale_lock_minutes: 15
    deadlock_minutes: 20
    no_progress_minutes: 30
    # How many times the owning component may retry a stage the watchdog killed.
    stage_retry_budget: 1
    # Grace before escalating TERM to KILL, spent once per tick, not per pid.
    kill_grace_s: 5
    # Per-tick remediation budget, so a tick cannot block long enough to trip
    # the watchdog's own no-progress rule.
    remediation_budget:
      max_per_tick: 5
    # Per-stage output-growth timeouts, in minutes.
    timeouts:
      lane: 180
      gate: 90
      fix: 60
      rebase: 45
      merge: 60
