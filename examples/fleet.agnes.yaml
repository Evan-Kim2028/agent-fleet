# Agnes backend fleet config — copy to ~/.agent-fleet/fleet.yaml
# Requires: AGNES_API_KEY (Agnes AI, apihub.agnes-ai.com), stored in .env
# Reuses the shared OpenRouter OpenAI-compatible HTTP client — no binary to install
# Free tier ~20 RPM: keep max_parallel: 1

default_backend: agnes
default_model: agnes-2.5-flash
default_persona: coder
default_mode: agent
max_parallel: 1
timeout_seconds: 900
default_pipeline: code_review

# Optional — override the default Agnes endpoint:
# agnes_base_url: https://apihub.agnes-ai.com/v1

personas:
  coder:
    prompt: coder.md
  reviewer:
    prompt: reviewer.md
  explorer:
    prompt: explorer.md
    mode: plan

pipelines:
  simple:
    - execute
  code_review:
    - execute
    - review
  full:
    - plan
    - research
    - synthesize
    - implement
    - verify
    - review
